name: Web Build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "tco-contract.json"
      - "country-packs/AT/manifest.yaml"
      - ".github/workflows/web-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "tco-contract.json"
      - "country-packs/AT/manifest.yaml"
      - ".github/workflows/web-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Install frontend packages
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
