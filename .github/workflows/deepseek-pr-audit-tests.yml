name: DeepSeek PR Auditor Tests

on:
  pull_request:
    paths:
      - "scripts/deepseek_pr_audit.py"
      - "tests/test_deepseek_pr_audit.py"
      - ".github/workflows/deepseek-pr-audit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run auditor unit tests
        run: python -m unittest tests.test_deepseek_pr_audit -v
