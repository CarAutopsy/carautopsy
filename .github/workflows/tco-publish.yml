name: Publish TCO Results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/variants/**'
      - 'country-packs/AT/**'
      - 'scripts/publish_tco.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Compute autopsies and open refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_tco.py
