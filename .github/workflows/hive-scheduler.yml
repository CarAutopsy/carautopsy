name: The Hive (Multi-Agent Curation)

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Run Hive Orchestrator
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_CARAUTOPSY_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/hive_orchestrator.py
