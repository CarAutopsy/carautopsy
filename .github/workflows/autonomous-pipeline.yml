name: Autonomous Pipeline (Hive Research + TCO)

on:
  # Run every 15 minutes while observing initial autonomous research runs.
  schedule:
    # Offset from quarter-hour boundaries to reduce GitHub scheduler contention.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose isolated provider smoke test, Hive research, or gated TCO"
        required: true
        default: "research-only"
        type: choice
        options:
          - research-only
          - provider-smoke-test
          - crawler-only
          - full

# Least privilege by default; the research/TCO job opts in to write access below.
permissions:
  contents: read

jobs:
  run:
    if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'crawler-only'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: autonomous-pipeline-research
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    steps:
      - name: Publish automation heartbeat
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ inputs.run_mode || 'scheduled-research' }}
        run: |
          {
            echo "## Autonomous pipeline heartbeat"
            echo "- Status: **STARTED**"
            echo "- Trigger: \`$EVENT_NAME\`"
            echo "- Mode: \`$RUN_MODE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: [#$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Started (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      # The script-level gate (scripts/hive_research_gate.py) stays authoritative.
      # This preflight only avoids installing dependencies and requiring secrets on
      # runs that the gate is guaranteed to stop. If the flag is changed or renamed,
      # the preflight does not match and the normal path (and gate) runs unchanged.
      - name: Preflight - research pause
        id: preflight
        if: github.event_name == 'schedule' || inputs.run_mode == 'research-only'
        run: |
          if grep -qE '^VERIFIED_RETRIEVAL_AVAILABLE = False[[:space:]]*$' scripts/autonomous_pipeline.py; then
            {
              echo "### Research outcome"
              echo "**PAUSED - expected security gate (preflight)**"
              echo "- VERIFIED_RETRIEVAL_AVAILABLE is False; dependency install, token check and provider calls were skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.preflight.outputs.paused != 'true'
        with:
          python-version: "3.12"
      - name: Install deps
        if: steps.preflight.outputs.paused != 'true'
        run: pip install -r requirements.txt
      - name: Require PR automation token
        if: (github.event_name == 'schedule' || inputs.run_mode == 'research-only') && steps.preflight.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ secrets.CARAUTOPSY_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure the CARAUTOPSY_PR_TOKEN repository secret using a least-privilege GitHub App or PAT token."
            exit 1
          fi
      - name: Hive research + two independent AI audits
        if: (github.event_name == 'schedule' || inputs.run_mode == 'research-only') && steps.preflight.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ secrets.CARAUTOPSY_PR_TOKEN }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_CARAUTOPSY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          HIVE_RESEARCH_BATCH_SIZE: ${{ vars.HIVE_RESEARCH_BATCH_SIZE }}
        run: |
          set +e
          python scripts/autonomous_pipeline.py --research-only 2>&1 | tee "$RUNNER_TEMP/hive-research.log"
          pipeline_statuses=( "${PIPESTATUS[@]}" )
          pipeline_status=${pipeline_statuses[0]}
          tee_status=${pipeline_statuses[1]}
          set -e

          if [ "$tee_status" -ne 0 ]; then
            echo "### Research outcome" >> "$GITHUB_STEP_SUMMARY"
            echo "**FAILED — could not capture the research outcome log (tee exit $tee_status)**" >> "$GITHUB_STEP_SUMMARY"
            exit "$tee_status"
          fi

          if [ "$pipeline_status" -eq 2 ] && grep -qF "HIVE_RESEARCH_PAUSED:" "$RUNNER_TEMP/hive-research.log"; then
            pause_message="$(grep -F "HIVE_RESEARCH_PAUSED:" "$RUNNER_TEMP/hive-research.log" | tail -n 1)"
            {
              echo "### Research outcome"
              echo "**PAUSED — expected security gate**"
              echo "- $pause_message"
              echo "- No provider call or research queue dispatch was performed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Research is intentionally paused by the owner-controlled security gate."
            exit 0
          fi

          if [ "$pipeline_status" -ne 0 ]; then
            echo "### Research outcome" >> "$GITHUB_STEP_SUMMARY"
            echo "**FAILED — unexpected pipeline error (exit $pipeline_status)**" >> "$GITHUB_STEP_SUMMARY"
            exit "$pipeline_status"
          fi

          rejection_summary="$(grep -F "Research cycle completed and saved for human review:" "$RUNNER_TEMP/hive-research.log" | tail -n 1 || true)"
          {
            echo "### Research outcome"
            if [ -n "$rejection_summary" ]; then
              echo "**COMPLETED WITH REJECTIONS**"
              echo "- $rejection_summary"
            else
              echo "**COMPLETED**"
              echo "- Research cycle completed successfully; proposal is awaiting human review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Provider smoke test only
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'provider-smoke-test'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_CARAUTOPSY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: python scripts/autonomous_pipeline.py --provider-smoke-test
      - name: Gated TCO pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_CARAUTOPSY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: python scripts/autonomous_pipeline.py
  # Read-only issue crawler and mapped-task reconciliation; no comments, roadmap writes, or dispatch.
  issue-roadmap-crawler:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'crawler-only')
    concurrency:
      group: autonomous-pipeline-issue-crawler-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install crawler dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Crawl and classify all issue states (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/issue_roadmap_controller.py --fetch-github --state all --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/issue-roadmap-dry-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/issue-roadmap-dry-run.json").read_text(encoding="utf-8"))
          summary = [
              "## Issue roadmap crawler",
              "",
              "- Mode: **read-only dry run**",
              f"- Issue snapshots (all states): **{report['issue_snapshots_seen']}**",
              f"- Proposals: **{report['proposal_count']}**",
              f"- Actionable: **{report['actionable_proposal_count']}**",
              f"- Owner triage: **{report['owner_triage_count']}**",
              "- Roadmap/GitHub writes: **none**",
              "- Task dispatch: **none**",
              "",
              "The JSON report is available as the issue-roadmap-dry-run workflow artifact.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          PY
      - name: Upload dry-run report
        uses: actions/upload-artifact@v7
        with:
          name: issue-roadmap-dry-run
          path: ${{ runner.temp }}/issue-roadmap-dry-run.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare scoped reconciliation input
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/issue_roadmap_workflow_input.py \
            --crawler-report "$RUNNER_TEMP/issue-roadmap-dry-run.json" \
            --roadmap-state docs/operations/issue-roadmap-state.json \
            --repo "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/issue-roadmap-reconciliation-input.json"
      - name: Collect read-only PR and exact-head CI evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/issue_roadmap_evidence.py \
            --input "$RUNNER_TEMP/issue-roadmap-reconciliation-input.json" \
            --render-artifact-json \
            > "$RUNNER_TEMP/issue-roadmap-reconciliation-proposal.json"
      - name: Summarize reconciliation proposal
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = json.loads(
              Path(os.environ["RUNNER_TEMP"] + "/issue-roadmap-reconciliation-proposal.json").read_text(encoding="utf-8")
          )
          report = artifact["report"]
          pending = sum(
              item.get("requires_owner_approval") is True and item.get("proposed_status") is not None
              for item in report["unchanged"]
          )
          summary = [
              "## Issue roadmap reconciliation",
              "",
              "- Mode: **read-only proposal**",
              f"- Canonical tasks checked: **{len(report['proposals']) + len(report['unchanged'])}**",
              f"- Status changes with prior owner approval: **{len(report['proposals'])}**",
              f"- Pending owner decisions: **{pending}**",
              "- Roadmap/GitHub writes: **none**",
              "- Task dispatch: **none**",
              f"- Proposal ID: `{artifact['proposal_id']}`",
              "",
              "The complete deterministic JSON is available as the issue-roadmap-reconciliation-proposal workflow artifact.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          PY
      - name: Upload reconciliation proposal
        uses: actions/upload-artifact@v7
        with:
          name: issue-roadmap-reconciliation-proposal
          path: ${{ runner.temp }}/issue-roadmap-reconciliation-proposal.json
          if-no-files-found: error
          retention-days: 7
