name: Autonomous Pipeline (Hive + TCO + Commit)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose full pipeline or isolated provider API smoke test"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - provider-smoke-test

permissions:
  contents: write

concurrency:
  group: autonomous-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Curate + Compute + Commit
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_CARAUTOPSY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          if [ "${{ inputs.run_mode }}" = "provider-smoke-test" ]; then
            python scripts/autonomous_pipeline.py --provider-smoke-test
          else
            python scripts/autonomous_pipeline.py
          fi
