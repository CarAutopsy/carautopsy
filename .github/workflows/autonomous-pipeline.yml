name: Autonomous Pipeline (Hive Research + TCO)

on:
  # Run every 15 minutes while observing initial autonomous research runs.
  schedule:
    # Offset from quarter-hour boundaries to reduce GitHub scheduler contention.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose isolated provider smoke test, Hive research, or gated TCO"
        required: true
        default: "research-only"
        type: choice
        options:
          - research-only
          - provider-smoke-test
          - crawler-only
          - full

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-26.04
    steps:
      - name: Publish automation heartbeat
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ inputs.run_mode || 'scheduled-research' }}
        run: |
          {
            echo "## Autonomous pipeline heartbeat"
            echo "- Status: **STARTED**"
            echo "- Trigger: \`$EVENT_NAME\`"
            echo "- Mode: \`$RUN_MODE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: [#$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Started (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Require PR automation token
        if: github.event_name == 'schedule' || inputs.run_mode == 'research-only'
        env:
          GH_TOKEN: ${{ secrets.CARAUTOPSY_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure the CARAUTOPSY_PR_TOKEN repository secret using a least-privilege GitHub App or PAT token."
            exit 1
          fi
      - name: Hive research + two independent AI audits
        if: github.event_name == 'schedule' || inputs.run_mode == 'research-only'
        env:
          GH_TOKEN: ${{ secrets.CARAUTOPSY_PR_TOKEN }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_CARAUTOPSY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          HIVE_RESEARCH_BATCH_SIZE: ${{ vars.HIVE_RESEARCH_BATCH_SIZE }}
        run: |
          set +e
          python scripts/autonomous_pipeline.py --research-only 2>&1 | tee "$RUNNER_TEMP/hive-research.log"
          pipeline_statuses=( "${PIPESTATUS[@]}" )
          pipeline_status=${pipeline_statuses[0]}
          tee_status=${pipeline_statuses[1]}
          set -e

          if [ "$tee_status" -ne 0 ]; then
            echo "### Research outcome" >> "$GITHUB_STEP_SUMMARY"
            echo "**FAILED — could not capture the research outcome log (tee exit $tee_status)**" >> "$GITHUB_STEP_SUMMARY"
            exit "$tee_status"
          fi

          if [ "$pipeline_status" -eq 2 ] && grep -qF "HIVE_RESEARCH_PAUSED:" "$RUNNER_TEMP/hive-research.log"; then
            pause_message="$(grep -F "HIVE_RESEARCH_PAUSED:" "$RUNNER_TEMP/hive-research.log" | tail -n 1)"
            {
              echo "### Research outcome"
              echo "**PAUSED — expected security gate**"
              echo "- $pause_message"
              echo "- No provider call or research queue dispatch was performed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Research is intentionally paused by the owner-controlled security gate."
            exit 0
          fi

          if [ "$pipeline_status" -ne 0 ]; then
            echo "### Research outcome" >> "$GITHUB_STEP_SUMMARY"
            echo "**FAILED — unexpected pipeline error (exit $pipeline_status)**" >> "$GITHUB_STEP_SUMMARY"
            exit "$pipeline_status"
          fi

          rejection_summary="$(grep -F "Research cycle completed and saved for human review:" "$RUNNER_TEMP/hive-research.log" | tail -n 1 || true)"
          {
            echo "### Research outcome"
            if [ -n "$rejection_summary" ]; then
              echo "**COMPLETED WITH REJECTIONS**"
              echo "- $rejection_summary"
            else
              echo "**COMPLETED**"
              echo "- Research cycle completed successfully; proposal is awaiting human review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Provider smoke test only
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'provider-smoke-test'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_CARAUTOPSY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: python scripts/autonomous_pipeline.py --provider-smoke-test
      - name: Gated TCO pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'full'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_CARAUTOPSY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: python scripts/autonomous_pipeline.py
  # Read-only issue crawler: reuses this workflow's existing 15-minute schedule.
  # No comments, roadmap writes, or task dispatch; report is a short-lived artifact.
  issue-roadmap-crawler:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'crawler-only')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install crawler dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Crawl and classify open issues (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/issue_roadmap_controller.py --fetch-github --state all --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/issue-roadmap-dry-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/issue-roadmap-dry-run.json").read_text(encoding="utf-8"))
          summary = [
              "## Issue roadmap crawler",
              "",
              "- Mode: **read-only dry run**",
              f"- Open issue snapshots: **{report['issue_snapshots_seen']}**",
              f"- Proposals: **{report['proposal_count']}**",
              f"- Actionable: **{report['actionable_proposal_count']}**",
              f"- Owner triage: **{report['owner_triage_count']}**",
              "- Roadmap/GitHub writes: **none**",
              "- Task dispatch: **none**",
              "",
              "The JSON report is available as the issue-roadmap-dry-run workflow artifact.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          PY
      - name: Upload dry-run report
        uses: actions/upload-artifact@v6
        with:
          name: issue-roadmap-dry-run
          path: ${{ runner.temp }}/issue-roadmap-dry-run.json
          if-no-files-found: error
          retention-days: 7
