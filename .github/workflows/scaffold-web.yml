name: Scaffold Web MVP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Generate Next.js App
        run: |
          # Remove the placeholder directory
          rm -rf apps/web
          # Create a full Next.js app non-interactively
          npx create-next-app@latest apps/web --typescript --tailwind --eslint --app --src-dir --import-alias "@/*" --use-npm --yes
          
      - name: Commit and Push
        run: |
          git config user.name "hive-bot"
          git config user.email "hive-bot@users.noreply.github.com"
          git add apps/web
          git commit -m "feat(web): scaffold Next.js MVP via Actions"
          git push
