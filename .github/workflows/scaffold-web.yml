name: Scaffold Web MVP

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Generate Next.js App
        run: |
          rm -rf apps/web
          npx create-next-app@latest apps/web --typescript --tailwind --eslint --app --src-dir --import-alias "@/*" --use-npm --yes

      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hive-bot"
          git config user.email "hive-bot@users.noreply.github.com"
          git checkout -B scaffold/web-mvp
          git add apps/web
          git commit -m "feat(web): scaffold Next.js MVP via Actions"
          git push -u origin scaffold/web-mvp
          gh pr create --title "🏗️ Scaffold: Next.js Web MVP" \
            --body "Auto-generated Next.js scaffold (TypeScript, Tailwind, App Router). Merge to enable Vercel deployment." \
            --base main --head scaffold/web-mvp || echo "PR already open for this branch"
