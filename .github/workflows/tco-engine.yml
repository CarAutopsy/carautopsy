name: Live TCO Calculation (Austria)

on:
  workflow_dispatch:

jobs:
  run_tco:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run CarAutopsy TCO Engine v0.2 (BEV vs ICE autopsy)
        run: |
          python - <<'PY'
          import json, math, yaml
          from pathlib import Path
          from datetime import datetime, timezone

          def load(p):
              with open(p, encoding="utf-8") as f:
                  return json.load(f) if p.endswith(".json") else yaml.safe_load(f)

          taxes = load("country-packs/AT/taxes.yaml")
          defaults = load("country-packs/AT/defaults.yaml")

          def nova_for(v):
              pt = v["identity"]["powertrain"]
              if pt in taxes["nova"]["exemptions"]:
                  return 0.0, "exempt (BEV/FCEV)"
              co2 = v["emissions"]["co2_wltp_gpkm"] or 0
              f = taxes["nova"]["formula"]
              pct = math.floor((co2 - f["co2_deduction_gkm"]) / f["divisor"])
              pct = max(f["min_percentage"], min(f["max_percentage"], pct))
              malus = 0.0
              for b in taxes["nova"]["malus"]["brackets"]:
                  if co2 > b["threshold_gkm"]:
                      malus += (co2 - b["threshold_gkm"]) * b["rate_eur_per_gkm_over_threshold"]
              gross = v["offers"][0]["list_price_minor"] / 100.0
              net = gross / ((1 + pct / 100.0) * 1.20)
              amount = max(0.0, net * pct / 100.0 - f["fixed_deduction_eur"]) + malus
              return round(amount, 2), f"{pct}% rate, malus {malus:.2f}"

          def motor_tax_monthly(v):
              pt = v["identity"]["powertrain"]
              if pt in taxes["motorbezogene_versicherungssteuer"]["exemptions"]:
                  return 0.0
              f = taxes["motorbezogene_versicherungssteuer"]["formula"]
              kw = (v["performance"]["power_w"] or 0) / 1000.0
              co2 = v["emissions"]["co2_wltp_gpkm"] or 0
              p = max(0.0, kw - f["power"]["threshold_kw"]) * f["power"]["rate_eur_per_kw_over_threshold"]
              c = max(0.0, co2 - f["co2"]["threshold_gkm"]) * f["co2"]["rate_eur_per_gkm_over_threshold"]
              return round(p + c, 2)

          def tco(v):
              pt = v["identity"]["powertrain"]
              yrs = defaults["horizon_years_default"]
              km = defaults["annual_km_default"]
              nova, note = nova_for(v)
              mtax = motor_tax_monthly(v) * 12 * yrs
              if pt == "bev":
                  wh = (v["energy"]["consumption_wh_km"]["real_world"]
                        or v["energy"]["consumption_wh_km"]["wltp_combined"] or 0)
                  energy = (wh / 1000.0) * km * defaults["energy"]["electricity_tariff_eur_kwh"] * yrs
                  maint = defaults["maintenance_annual_eur"]["bev"] * yrs
                  ins = defaults["insurance_proxy_annual_eur"]["bev"] * yrs
              else:
                  l100 = (v["extensions"].get("fuel_consumption_l_100km") or {}).get("real_world") or 6.5
                  price = defaults["energy"]["diesel_eur_l"] if "diesel" in pt else defaults["energy"]["petrol_eur_l"]
                  energy = (l100 / 100.0) * km * price * yrs
                  maint = defaults["maintenance_annual_eur"].get(pt, 450) * yrs
                  ins = defaults["insurance_proxy_annual_eur"]["ice"] * yrs
              tyres = (km * yrs / defaults["tyres"]["interval_km"]) * defaults["tyres"]["set_cost_eur"]
              insp = defaults["inspection_annual_proxy_eur"] * yrs
              total = nova + mtax + energy + maint + ins + tyres + insp
              return {
                  "variant_id": v["variant_id"],
                  "powertrain": pt,
                  "nova_eur": nova,
                  "nova_detail": note,
                  "motor_tax_monthly_eur": motor_tax_monthly(v),
                  "energy_5y_eur": round(energy, 2),
                  "maintenance_5y_eur": round(maint, 2),
                  "insurance_5y_eur": round(ins, 2),
                  "tyres_5y_eur": round(tyres, 2),
                  "inspection_5y_eur": round(insp, 2),
                  "total_5y_eur": round(total, 2),
                  "monthly_eur": round(total / (yrs * 12), 2),
              }

          bev = tco(load("catalog/variants/tesla.model-3.highland.rwd-60.json"))
          ice = tco(load("catalog/variants/vw.tiguan.2026.tdi-150.json"))

          print("\n🚗 CarAutopsy TCO Engine v0.2 — BEV vs ICE Autopsy (Austria, 5y / 15,000 km/yr)")
          print("=" * 78)
          for r in (bev, ice):
              print(f"\n{r['variant_id']}  [{r['powertrain']}]")
              print(f"  NoVA (one-time):        €{r['nova_eur']:>10,.2f}   ({r['nova_detail']})")
              print(f"  Motor tax (monthly):    €{r['motor_tax_monthly_eur']:>10,.2f}")
              print(f"  Energy 5y:              €{r['energy_5y_eur']:>10,.2f}")
              print(f"  Maintenance 5y:         €{r['maintenance_5y_eur']:>10,.2f}")
              print(f"  Insurance proxy 5y:     €{r['insurance_5y_eur']:>10,.2f}")
              print(f"  Tyres 5y:               €{r['tyres_5y_eur']:>10,.2f}")
              print(f"  §57a inspection 5y:     €{r['inspection_5y_eur']:>10,.2f}")
              print(f"  TOTAL 5y (excl. dep.):  €{r['total_5y_eur']:>10,.2f}   = €{r['monthly_eur']:,.2f}/month")
          print("\n" + "=" * 78)
          print(f"⚖️  5-year operating delta (ICE - BEV): €{ice['total_5y_eur'] - bev['total_5y_eur']:,.2f}")

          envelope = {
              "engine_version": "0.2.0",
              "country_pack": "AT@1.0.0",
              "calculation_timestamp": datetime.now(timezone.utc).isoformat(),
              "currency": "EUR",
              "assumptions_version": "AT-defaults@1.0.0",
              "sources": ["AT-BMF-tax-2024", "AT-OEAMTC-57a", "AT-defaults-assumptions-1.0.0"],
              "confidence": "medium",
              "note": "Excludes depreciation and financing; operating + statutory costs only."
          }
          print("\n📊 AUDIT ENVELOPE:")
          print(json.dumps(envelope, indent=2))
          print("\n✅ TCO Engine v0.2 executed successfully.")
          PY
