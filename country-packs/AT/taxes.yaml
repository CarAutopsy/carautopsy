# Austria M1 tax rules. Draft pending legal sign-off and catalog data completeness.
country: AT
version: "1.2.0-draft"
currency: EUR
status: draft
nova:
  description: "M1 NoVA. Purchase base must explicitly exclude VAT and NoVA."
  effective_from: "2025-07-01"
  exemptions: [bev, fcev]
  annual_rules:
    2025: {co2_deduction_gkm: 94, divisor: 5, min_percentage: 0, max_percentage: 80, rounding: commercial_half_up, malus_threshold_gkm: 155, malus_eur_per_gkm: 80, fixed_deduction_eur: 350}
    2026: {co2_deduction_gkm: 91, divisor: 5, min_percentage: 0, max_percentage: 80, rounding: commercial_half_up, malus_threshold_gkm: 155, malus_eur_per_gkm: 80, fixed_deduction_eur: 350}
    2027: {co2_deduction_gkm: 88, divisor: 5, min_percentage: 0, max_percentage: 80, rounding: commercial_half_up, malus_threshold_gkm: 155, malus_eur_per_gkm: 80, fixed_deduction_eur: 350}
    2028: {co2_deduction_gkm: 85, divisor: 5, min_percentage: 0, max_percentage: 80, rounding: commercial_half_up, malus_threshold_gkm: 155, malus_eur_per_gkm: 80, fixed_deduction_eur: 350}
    2029: {co2_deduction_gkm: 82, divisor: 5, min_percentage: 0, max_percentage: 80, rounding: commercial_half_up, malus_threshold_gkm: 155, malus_eur_per_gkm: 80, fixed_deduction_eur: 350}
motorbezogene_versicherungssteuer:
  description: "M1 monthly motor-related insurance tax. Thresholds are fixed by first-registration year."
  bev_m1:
    effective_from: "2025-04-01"
    power:
      deduction_kw: 45
      minimum_taxable_kw: 10
      tiers:
        - {up_to_kw: 35, rate_eur_per_kw: 0.25}
        - {up_to_kw: 60, rate_eur_per_kw: 0.35}
        - {rate_eur_per_kw: 0.45}
    weight:
      deduction_kg: 900
      minimum_taxable_kg: 200
      tiers:
        - {up_to_kg: 500, rate_eur_per_kg: 0.015}
        - {up_to_kg: 1200, rate_eur_per_kg: 0.030}
        - {rate_eur_per_kg: 0.045}
  annual_rules:
    2024:
      ice: {power_deduction_kw: 61, co2_deduction_gpkm: 103, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
      phev: {power_deduction_kw: 61, co2_deduction_gpkm: 13, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
    2025:
      ice: {power_deduction_kw: 60, co2_deduction_gpkm: 100, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
      phev: {power_deduction_kw: 60, co2_deduction_gpkm: 12, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
    2026:
      ice: {power_deduction_kw: 59, co2_deduction_gpkm: 97, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
      phev: {power_deduction_kw: 59, co2_deduction_gpkm: 24, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
    2027:
      ice: {power_deduction_kw: 58, co2_deduction_gpkm: 94, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
      phev: {power_deduction_kw: 58, co2_deduction_gpkm: 24, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
    2028:
      phev: {power_deduction_kw: 57, co2_deduction_gpkm: 36, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
    2029:
      phev: {power_deduction_kw: 56, co2_deduction_gpkm: 35, minimum_taxable_kw: 5, minimum_taxable_gpkm: 5, rate_eur: 0.72}
