# Austria M1 tax rules — 2026 baseline; calculation engine migration pending.
# Official reference: BMF NoVA (Rechtslage ab 1. Juli 2025) and
# BMF Motorbezogene Versicherungssteuer (Steuersatz).
# DRAFT: Do not treat this pack as legally verified or production-ready.
country: AT
version: "1.1.0-draft"
currency: EUR
status: draft
nova:
  description: "2026 M1 passenger-car NoVA; taxable base must exclude VAT and NoVA."
  effective_from: "2026-01-01"
  exemptions: [bev, fcev]
  formula:
    co2_deduction_gkm: 91
    divisor: 5
    rounding: commercial_half_up
    min_percentage: 0
    max_percentage: 80
    fixed_deduction_eur: 350
  malus:
    threshold_gkm: 155
    rate_eur_per_gkm_over_threshold: 80
motorbezogene_versicherungssteuer:
  description: "2026 M1 passenger-car monthly tax; depends on first registration and powertrain."
  effective_from: "2026-01-01"
  exemptions: []
  ice_m1:
    first_registration_year: 2026
    power:
      threshold_kw: 59
      minimum_taxable_kw: 5
      rate_eur_per_kw: 0.72
    co2:
      threshold_gkm: 97
      minimum_taxable_gkm: 5
      rate_eur_per_gkm: 0.72
  bev_m1:
    power:
      deduction_kw: 45
      minimum_taxable_kw: 10
      tiers:
        - {up_to_kw: 35, rate_eur_per_kw: 0.25}
        - {up_to_kw: 60, rate_eur_per_kw: 0.35}
        - {above_kw: 60, rate_eur_per_kw: 0.45}
    weight:
      deduction_kg: 900
      minimum_taxable_kg: 200
      tiers:
        - {up_to_kg: 500, rate_eur_per_kg: 0.015}
        - {up_to_kg: 1200, rate_eur_per_kg: 0.030}
        - {above_kg: 1200, rate_eur_per_kg: 0.045}
  phev_m1:
    first_registration_year: 2026
    co2_threshold_gkm: 24
    note: "Use combustion-engine power and weighted WLTP CO2; implementation pending."
sources:
  - id: at-bmf-nova
    name: "BMF - Normverbrauchsabgabe (NoVA)"
    url: "https://www.bmf.gv.at/themen/steuern/verkehr-und-immobilien/normverbrauchsabgabe.html"
    retrieved: "2026-11-10"
    licence: "Public / Statutory"
  - id: at-bmf-motorbez
    name: "BMF - Motorbezogene Versicherungssteuer"
    url: "https://www.bmf.gv.at/themen/steuern/verkehr-und-immobilien/motorbezogene-versicherungssteuer.html"
    retrieved: "2026-11-10"
    licence: "Public / Statutory"
