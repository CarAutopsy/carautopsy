# CarAutopsy Austria (AT) Incentives & Subsidies
# Version: 1.0.0
# Effective from: 2024-01-01

country: AT
name: "E-Mobilitätsbonus & Förderungen"
version: "1.0.0"
currency: EUR

rules:
  bev_purchase_subsidy_eur: 2500.00  # Federal subsidy for pure EVs (varies by budget year)
  phev_purchase_subsidy_eur: 1250.00 # Federal subsidy for PHEVs (range > 50km)
  wallbox_subsidy_eur: 600.00        # Subsidy for home charging station installation
  
  # NoVA exemption only; M1 BEVs are subject to motorbezogene Versicherungssteuer from 2025-04-01.
  exemptions:
    - nova                            # BEVs/FCEVs pay 0% NoVA registration tax

