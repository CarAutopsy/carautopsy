# CarAutopsy Austria (AT) Inspection Rules (§57a Begutachtung)
# Version: 1.0.0
# Effective from: 2012-07-01 (The "3-2-1-1-1" rule)
# Source: ÖAMTC / ARBÖ

country: AT
name: "§57a Begutachtung (Pickerl)"
version: "1.0.0"
currency: EUR

rules:
  # First inspection after 3 years, then 2, then 1, then 1, then 1.
  intervals_years: [3, 2, 1, 1, 1]
  
  # You can get the inspection up to 4 months before or 4 months after the due date.
  grace_period_months: 4 
  
  applies_to: ["car", "suv", "van", "pickup", "motorcycle"]
  exemptions: []

defaults:
  # Average cost at an independent workshop (ÖAMTC/ARBÖ members often get discounts)
  average_cost_eur: 35.00
  # Cost if the car fails and requires re-inspection
  reinspection_cost_eur: 15.00

