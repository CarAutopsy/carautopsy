# Qodo Agentic Review automation.
# Reviews are advisory; human approval and repository branch rules remain the merge gates.

[github_app]
pr_commands = [
  "/agentic_review",
]

# Re-run reviews after commits, including commits authored by automation bots.
handle_push_trigger = true
push_trigger_ignore_bot_commits = false
push_commands = [
  "/agentic_review",
]

# Review draft PRs. With draft feedback enabled, ready-for-review does not
# invoke pr_commands a second time; opened/reopened and push events are covered.
feedback_on_draft_pr = true
